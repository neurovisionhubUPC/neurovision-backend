quarkus.application.name=analytics-service

# Phase 1 deliberately defines no Kafka channel and no MongoDB adapter.
# Their health checks stay disabled until a later phase owns real dependency behavior.
quarkus.kafka.devservices.enabled=false
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.connection-string=${ANALYTICS_MONGODB_CONNECTION_STRING}
quarkus.mongodb.database=${ANALYTICS_MONGODB_DATABASE:neurovision_analytics}
quarkus.mongodb.health.enabled=false

# Cognito access-token validation mirrors the other authenticated services.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${COGNITO_ISSUER_URL}
quarkus.oidc.client-id=${COGNITO_CLIENT_ID}
quarkus.oidc.token.issuer=${COGNITO_ISSUER_URL}
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.required-claims.token_use=access
quarkus.oidc.token.required-claims.client_id=${COGNITO_CLIENT_ID}
quarkus.oidc.roles.role-claim-path=cognito:groups
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR

# The scaffold emits local metrics but exports no traces until deployment owns a collector.
quarkus.otel.sdk.disabled=true

quarkus.container-image.group=neurovision
quarkus.container-image.name=analytics-service
quarkus.kubernetes.name=analytics-service
quarkus.kubernetes.namespace=neurovision
quarkus.kubernetes.part-of=neurovision-rehab
quarkus.kubernetes.labels."app.kubernetes.io/component"=analytics
quarkus.kubernetes.idempotent=true
quarkus.kubernetes.add-version-to-label-selectors=false
quarkus.kubernetes.image-pull-policy=if-not-present
quarkus.kubernetes.ports.http.host-port=8080
quarkus.kubernetes.env.configmaps=analytics-service-config
quarkus.kubernetes.prometheus.generate-service-monitor=false
quarkus.kubernetes.resources.requests.cpu=50m
quarkus.kubernetes.resources.requests.memory=64Mi
quarkus.kubernetes.resources.limits.cpu=500m
quarkus.kubernetes.resources.limits.memory=256Mi
quarkus.kubernetes.security-context.run-as-non-root=true
quarkus.kubernetes.security-context.run-as-user=1001

# Tests exercise only the empty service boundary and never contact external systems.
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.auth-server-url=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test
%test.quarkus.oidc.client-id=test-client
%test.quarkus.oidc.token.issuer=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test
%test.quarkus.oidc.token.required-claims.client_id=test-client
%test.quarkus.mongodb.connection-string=mongodb://127.0.0.1:65532/analytics_test
%test.quarkus.mongodb.database=analytics_test
%test.quarkus.mongodb.health.enabled=false
