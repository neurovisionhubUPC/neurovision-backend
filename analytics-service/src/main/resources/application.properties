quarkus.application.name=analytics-service

# Phase 2 owns strict Kafka admission and the durable MongoDB inbox.
quarkus.kafka.devservices.enabled=false
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.connection-string=${ANALYTICS_MONGODB_CONNECTION_STRING}
quarkus.mongodb.database=${ANALYTICS_MONGODB_DATABASE:neurovision_analytics}
quarkus.mongodb.health.enabled=true

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
mp.messaging.incoming.analytics-telemetry.connector=smallrye-kafka
mp.messaging.incoming.analytics-telemetry.topic=telemetry-batch-accepted.v1
mp.messaging.incoming.analytics-telemetry.group.id=analytics-inbox-v1
mp.messaging.incoming.analytics-telemetry.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.analytics-telemetry.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.analytics-telemetry.enable.auto.commit=false
mp.messaging.incoming.analytics-telemetry.commit-strategy=throttled
mp.messaging.incoming.analytics-telemetry.failure-strategy=fail
mp.messaging.incoming.analytics-telemetry.auto.offset.reset=earliest
mp.messaging.incoming.analytics-telemetry.max.poll.records=32
mp.messaging.incoming.analytics-telemetry.concurrency=1
analytics.consumer.max-event-bytes=${ANALYTICS_MAX_EVENT_BYTES:65536}
analytics.consumer.max-samples=${ANALYTICS_MAX_SAMPLES:1000}
analytics.consumer.max-future-skew-seconds=${ANALYTICS_MAX_FUTURE_SKEW_SECONDS:60}
analytics.consumer.max-retries=${ANALYTICS_MAX_RETRIES:2}
analytics.consumer.retry-delay-ms=${ANALYTICS_RETRY_DELAY_MS:100}
analytics.consumer.persistence-timeout-ms=${ANALYTICS_PERSISTENCE_TIMEOUT_MS:5000}
analytics.dlq.topic=${ANALYTICS_DLQ_TOPIC:analytics-telemetry.v1.dlq}
analytics.dlq.ack-timeout-ms=${ANALYTICS_DLQ_ACK_TIMEOUT_MS:6000}
analytics.inbox.collection=${ANALYTICS_INBOX_COLLECTION:telemetry_inbox_v1}
analytics.summary.collection=${ANALYTICS_SUMMARY_COLLECTION:stream_summaries_v1}
analytics.gaze-plot.cursor-signing-key=${ANALYTICS_GAZE_PLOT_CURSOR_SIGNING_KEY:}
analytics.clinical.base-url=${CLINICAL_INTERNAL_BASE_URL}
analytics.clinical.timeout-ms=${ANALYTICS_CLINICAL_TIMEOUT_MS:1000}

# Cognito access-token validation mirrors the other authenticated services.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${COGNITO_ISSUER_URL}
quarkus.oidc.client-id=${COGNITO_CLIENT_ID}
quarkus.oidc.token.issuer=${COGNITO_ISSUER_URL}
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.required-claims.token_use=access
quarkus.oidc.token.required-claims.client_id=${COGNITO_CLIENT_ID}
quarkus.oidc.roles.role-claim-path=cognito:groups
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR

# The scaffold emits local metrics but exports no traces until deployment owns a collector.
quarkus.otel.sdk.disabled=true

quarkus.container-image.group=neurovision
quarkus.container-image.name=analytics-service
quarkus.kubernetes.name=analytics-service
quarkus.kubernetes.namespace=neurovision
quarkus.kubernetes.part-of=neurovision-rehab
quarkus.kubernetes.labels."app.kubernetes.io/component"=analytics
quarkus.kubernetes.idempotent=true
quarkus.kubernetes.add-version-to-label-selectors=false
quarkus.kubernetes.image-pull-policy=if-not-present
quarkus.kubernetes.ports.http.host-port=8080
quarkus.kubernetes.env.configmaps=analytics-service-config
quarkus.kubernetes.prometheus.generate-service-monitor=false
quarkus.kubernetes.resources.requests.cpu=50m
quarkus.kubernetes.resources.requests.memory=64Mi
quarkus.kubernetes.resources.limits.cpu=500m
quarkus.kubernetes.resources.limits.memory=256Mi
quarkus.kubernetes.security-context.run-as-non-root=true
quarkus.kubernetes.security-context.run-as-user=1001

# Tests exercise only the empty service boundary and never contact external systems.
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.auth-server-url=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test
%test.quarkus.oidc.client-id=test-client
%test.quarkus.oidc.token.issuer=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test
%test.quarkus.oidc.token.required-claims.client_id=test-client
%test.quarkus.mongodb.connection-string=mongodb://127.0.0.1:65532/analytics_test
%test.quarkus.mongodb.database=analytics_test
%test.quarkus.mongodb.active=false
%test.quarkus.mongodb.health.enabled=false
%test.kafka.bootstrap.servers=127.0.0.1:65533
%test.mp.messaging.incoming.analytics-telemetry.enabled=false
%test.analytics.consumer.max-event-bytes=65536
%test.analytics.consumer.max-samples=100
%test.analytics.consumer.max-future-skew-seconds=60
%test.analytics.consumer.max-retries=2
%test.analytics.consumer.retry-delay-ms=1
%test.analytics.consumer.persistence-timeout-ms=1000
%test.analytics.clinical.base-url=http://127.0.0.1:65534
%test.analytics.clinical.timeout-ms=300
%test.analytics.gaze-plot.cursor-signing-key=test-only-gaze-plot-cursor-signing-key-32-bytes-minimum
