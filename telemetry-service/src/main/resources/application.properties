quarkus.application.name=telemetry-service

# Flyway uses JDBC for migrations; the high-volume sample path uses reactive PgPool.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${TELEMETRY_DB_USERNAME}
quarkus.datasource.password=${TELEMETRY_DB_PASSWORD}
quarkus.datasource.jdbc.url=${TELEMETRY_DB_JDBC_URL}
quarkus.datasource.reactive.url=${TELEMETRY_DB_REACTIVE_URL}
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.kafka.devservices.enabled=false
quarkus.otel.sdk.disabled=true

# Phase 4: 202 requires a connector completion after a broker ACK (not enqueue only).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
mp.messaging.outgoing.telemetry-batch-accepted.connector=smallrye-kafka
mp.messaging.outgoing.telemetry-batch-accepted.topic=telemetry-batch-accepted.v1
mp.messaging.outgoing.telemetry-batch-accepted.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.telemetry-batch-accepted.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.telemetry-batch-accepted.acks=all
mp.messaging.outgoing.telemetry-batch-accepted.waitForWriteCompletion=true
mp.messaging.outgoing.telemetry-batch-accepted.enable.idempotence=true
mp.messaging.outgoing.telemetry-batch-accepted.max.in.flight.requests.per.connection=5
mp.messaging.outgoing.telemetry-batch-accepted.delivery.timeout.ms=${TELEMETRY_KAFKA_DELIVERY_TIMEOUT_MS}
mp.messaging.outgoing.telemetry-batch-accepted.request.timeout.ms=${TELEMETRY_KAFKA_REQUEST_TIMEOUT_MS}
mp.messaging.outgoing.telemetry-batch-accepted.max.block.ms=${TELEMETRY_KAFKA_MAX_BLOCK_MS}
mp.messaging.outgoing.telemetry-batch-accepted.buffer.memory=${TELEMETRY_KAFKA_BUFFER_BYTES}
telemetry.kafka.ack-timeout-ms=${TELEMETRY_KAFKA_ACK_TIMEOUT_MS}

# The consumer commits offsets only for messages acknowledged after DB commit.
mp.messaging.incoming.telemetry-batch-persist.connector=smallrye-kafka
mp.messaging.incoming.telemetry-batch-persist.topic=telemetry-batch-accepted.v1
mp.messaging.incoming.telemetry-batch-persist.group.id=telemetry-timescale-v1
mp.messaging.incoming.telemetry-batch-persist.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.telemetry-batch-persist.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.telemetry-batch-persist.enable.auto.commit=false
mp.messaging.incoming.telemetry-batch-persist.commit-strategy=throttled
# The listener publishes to the restricted DLQ before acking; a DLQ failure nacks
# and this fail strategy keeps the source offset uncommitted.
mp.messaging.incoming.telemetry-batch-persist.failure-strategy=fail
mp.messaging.incoming.telemetry-batch-persist.auto.offset.reset=earliest
mp.messaging.incoming.telemetry-batch-persist.max.poll.records=32
mp.messaging.incoming.telemetry-batch-persist.max-queue-size-factor=1
mp.messaging.incoming.telemetry-batch-persist.pause-if-no-requests=true
mp.messaging.incoming.telemetry-batch-persist.concurrency=1
mp.messaging.incoming.telemetry-batch-persist.throttled.unprocessed-record-max-age.ms=30000
telemetry.consumer.max-event-bytes=${TELEMETRY_MAX_EVENT_BYTES}
telemetry.consumer.max-retries=2
telemetry.consumer.retry-delay-ms=100
telemetry.consumer.persistence-timeout-ms=5000
telemetry.dlq.topic=telemetry-batch-accepted.v1.dlq
telemetry.dlq.ack-timeout-ms=6000

# Cognito access JWT validation mirrors Clinical. No opaque/introspection fallback.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${COGNITO_ISSUER_URL}
quarkus.oidc.client-id=${COGNITO_CLIENT_ID}
quarkus.oidc.token.issuer=${COGNITO_ISSUER_URL}
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.required-claims.token_use=access
quarkus.oidc.token.required-claims.client_id=${COGNITO_CLIENT_ID}
quarkus.oidc.roles.role-claim-path=cognito:groups
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR

# Production deployment must supply measured bounds; no invented capacity SLA.
quarkus.http.limits.max-body-size=${TELEMETRY_MAX_REQUEST_BYTES}
telemetry.ingress.max-samples=${TELEMETRY_MAX_SAMPLES}
telemetry.ingress.max-future-skew-seconds=${TELEMETRY_MAX_FUTURE_SKEW_SECONDS}
telemetry.ingress.max-concurrent=${TELEMETRY_MAX_CONCURRENT_REQUESTS}
telemetry.ingress.max-batches-per-second=${TELEMETRY_MAX_BATCHES_PER_SECOND}
telemetry.clinical.base-url=${CLINICAL_INTERNAL_BASE_URL}
telemetry.clinical.timeout-ms=${TELEMETRY_CLINICAL_TIMEOUT_MS}

# Isolated test bounds are fixture values, not production recommendations.
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.active=false
%test.quarkus.flyway.active=false
%test.mp.messaging.incoming.telemetry-batch-persist.enabled=false
%test.telemetry.consumer.max-event-bytes=65536
%test.quarkus.oidc.auth-server-url=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test
%test.quarkus.oidc.client-id=test-client
%test.quarkus.oidc.token.issuer=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test
%test.quarkus.oidc.token.required-claims.client_id=test-client
%test.quarkus.http.limits.max-body-size=64K
%test.telemetry.ingress.max-samples=100
%test.telemetry.ingress.max-future-skew-seconds=60
%test.telemetry.ingress.max-concurrent=4
%test.telemetry.ingress.max-batches-per-second=100
%test.telemetry.clinical.base-url=http://127.0.0.1:65534
%test.telemetry.clinical.timeout-ms=300
%test.kafka.bootstrap.servers=127.0.0.1:65533
%test.mp.messaging.outgoing.telemetry-batch-accepted.delivery.timeout.ms=1000
%test.mp.messaging.outgoing.telemetry-batch-accepted.request.timeout.ms=500
%test.mp.messaging.outgoing.telemetry-batch-accepted.max.block.ms=500
%test.mp.messaging.outgoing.telemetry-batch-accepted.buffer.memory=1048576
%test.telemetry.kafka.ack-timeout-ms=1100
