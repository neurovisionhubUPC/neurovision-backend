quarkus.application.name=telemetry-service

# Phase 1 proves the module heartbeat without activating future persistence,
# migration, messaging, or authentication behavior.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=false
quarkus.datasource.devservices.enabled=false
quarkus.flyway.active=false
quarkus.kafka.devservices.enabled=false
quarkus.oidc.enabled=false
quarkus.otel.sdk.disabled=true

# Later phases must activate integrations with environment-supplied settings.
# No credentials or external service locations belong in this scaffold.
