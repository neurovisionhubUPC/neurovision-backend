# Amazon Cognito resource identifiers used by the application layer.
neurovision.cognito.user-pool-id=${COGNITO_USER_POOL_ID}
neurovision.cognito.client-id=${COGNITO_CLIENT_ID}
neurovision.cognito.region=${AWS_REGION}
neurovision.cognito.issuer-url=${COGNITO_ISSUER_URL}

# AWS SDK client configuration. Credentials are resolved through the default AWS
# credentials provider chain; no credentials belong in this file.
quarkus.cognito-user-pools.aws.region=${AWS_REGION}

# Validate Cognito JWT access tokens locally through OIDC discovery and JWKS.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${COGNITO_ISSUER_URL}
quarkus.oidc.client-id=${COGNITO_CLIENT_ID}
quarkus.oidc.token.issuer=${COGNITO_ISSUER_URL}
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.required-claims.token_use=access
quarkus.oidc.token.required-claims.client_id=${COGNITO_CLIENT_ID}
quarkus.oidc.roles.role-claim-path=cognito:groups

# Unit and integration tests must not contact the external identity provider.
%test.quarkus.oidc.enabled=false
