# Amazon Cognito resource identifiers used by the application layer.
neurovision.cognito.user-pool-id=${COGNITO_USER_POOL_ID}
neurovision.cognito.client-id=${COGNITO_CLIENT_ID}
neurovision.cognito.region=${AWS_REGION}
neurovision.cognito.issuer-url=${COGNITO_ISSUER_URL}

# AWS SDK client configuration. Credentials are resolved through the default AWS
# credentials provider chain; no credentials belong in this file.
quarkus.cognito-user-pools.aws.region=${AWS_REGION}

# PostgreSQL is provisioned automatically by Quarkus Dev Services in dev/test
# when no JDBC URL is configured. Production supplies its connection settings.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
# Outbox payloads use Hibernate's standard JSON mapping, independently from REST serialization.
quarkus.hibernate-orm.mapping.format.global=ignore

# Transactional outbox relay. HOSTNAME should be supplied by Kubernetes in production.
neurovision.outbox.worker-id=${HOSTNAME:local}
neurovision.outbox.batch-size=25
neurovision.outbox.poll-interval=1s
neurovision.outbox.lock-duration=60s
neurovision.outbox.retry-delay=5s

mp.messaging.outgoing.patient-account-invited.connector=smallrye-kafka
mp.messaging.outgoing.patient-account-invited.topic=patient-account-invited.v1
mp.messaging.outgoing.patient-account-invited.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.patient-account-invited.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.patient-account-invited.acks=all
mp.messaging.outgoing.patient-account-invited.enable.idempotence=true

# Validate Cognito JWT access tokens locally through OIDC discovery and JWKS.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${COGNITO_ISSUER_URL}
quarkus.oidc.client-id=${COGNITO_CLIENT_ID}
quarkus.oidc.token.issuer=${COGNITO_ISSUER_URL}
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.required-claims.token_use=access
quarkus.oidc.token.required-claims.client_id=${COGNITO_CLIENT_ID}
quarkus.oidc.roles.role-claim-path=cognito:groups

# Unit and integration tests must not contact the external identity provider.
%test.quarkus.oidc.enabled=false
%test.quarkus.scheduler.enabled=false
