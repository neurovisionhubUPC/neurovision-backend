quarkus.application.name=clinical-service

# PostgreSQL is provisioned automatically by Quarkus Dev Services in dev/test
# when no JDBC URL is configured. Production supplies its connection settings.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Persistence and messaging tests do not require external authentication.
%test.quarkus.oidc.enabled=false

# Validate Cognito JWT access tokens locally when protected HTTP interfaces are added.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${COGNITO_ISSUER_URL}
quarkus.oidc.client-id=${COGNITO_CLIENT_ID}
quarkus.oidc.token.issuer=${COGNITO_ISSUER_URL}
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.required-claims.token_use=access
quarkus.oidc.token.required-claims.client_id=${COGNITO_CLIENT_ID}
quarkus.oidc.roles.role-claim-path=cognito:groups

%test.quarkus.oidc.auth-server-url=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test
%test.quarkus.oidc.client-id=test-client
%test.quarkus.oidc.token.issuer=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test
%test.quarkus.oidc.token.required-claims.client_id=test-client

# Consume raw JSON so invalid contracts can be retried and preserved unchanged
# in the shared dead-letter topic.
mp.messaging.incoming.patient-account-invited.connector=smallrye-kafka
mp.messaging.incoming.patient-account-invited.topic=patient-account-invited.v1
mp.messaging.incoming.patient-account-invited.group.id=clinical-service
mp.messaging.incoming.patient-account-invited.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.patient-account-invited.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.patient-account-invited.auto.offset.reset=earliest
mp.messaging.incoming.patient-account-invited.enable.auto.commit=false
mp.messaging.incoming.patient-account-invited.commit-strategy=throttled
mp.messaging.incoming.patient-account-invited.failure-strategy=dead-letter-queue
mp.messaging.incoming.patient-account-invited.dead-letter-queue.topic=patient-account-invited.v1.dlq
mp.messaging.incoming.patient-account-invited.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.patient-account-invited.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Generate the Clinical application workload while shared platform resources
# remain managed under infra/kubernetes.
quarkus.container-image.group=neurovision
quarkus.container-image.name=clinical-service
quarkus.kubernetes.name=clinical-service
quarkus.kubernetes.namespace=neurovision
quarkus.kubernetes.part-of=neurovision-rehab
quarkus.kubernetes.labels."app.kubernetes.io/component"=clinical
quarkus.kubernetes.idempotent=true
quarkus.kubernetes.add-version-to-label-selectors=false
quarkus.kubernetes.image-pull-policy=if-not-present
quarkus.kubernetes.ports.http.host-port=8080
quarkus.kubernetes.env.configmaps=clinical-service-config
quarkus.kubernetes.env.secrets=clinical-database-credentials
quarkus.kubernetes.prometheus.generate-service-monitor=false
quarkus.kubernetes.resources.requests.cpu=50m
quarkus.kubernetes.resources.requests.memory=64Mi
quarkus.kubernetes.resources.limits.cpu=500m
quarkus.kubernetes.resources.limits.memory=256Mi
quarkus.kubernetes.security-context.run-as-non-root=true
quarkus.kubernetes.security-context.run-as-user=1001
