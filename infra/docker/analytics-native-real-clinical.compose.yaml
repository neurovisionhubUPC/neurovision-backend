# Test-only overlay for the isolated Analytics native/real-Clinical smoke.
# Use only with the project name analytics-ca13c-native-20260925.
services:
  clinical-postgresql:
    restart: "no"
  analytics-mongodb:
    ports: !override []
    restart: "no"
  kafka:
    ports: !override []
    restart: "no"
  clinical-service:
    ports: !override
      - "127.0.0.1:18183:8080"
    restart: "no"
  analytics-service:
    image: neurovision/analytics-service:compose-native
    ports: !override
      - "127.0.0.1:18185:8080"
    restart: "no"

networks:
  neurovision:
    name: analytics-ca13c-native-20260925-network

volumes:
  clinical-postgresql-data:
    external: true
    name: neurovision-rehab_clinical-postgresql-data
