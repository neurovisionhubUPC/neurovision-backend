apiVersion: v1
kind: Service
metadata:
  name: telemetry-service
  namespace: neurovision
  labels:
    app.kubernetes.io/name: telemetry-service
    app.kubernetes.io/component: telemetry
    app.kubernetes.io/part-of: neurovision-rehab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telemetry-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-service
  namespace: neurovision
  labels:
    app.kubernetes.io/name: telemetry-service
    app.kubernetes.io/component: telemetry
    app.kubernetes.io/part-of: neurovision-rehab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-service
        app.kubernetes.io/component: telemetry
        app.kubernetes.io/part-of: neurovision-rehab
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: telemetry-service
          image: neurovision/telemetry-service:k3d-historical-20260918-80a8ac10
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: telemetry-service-config
            - secretRef:
                name: telemetry-database-credentials
          env:
            - name: QUARKUS_SHUTDOWN_TIMEOUT
              value: 30s
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
