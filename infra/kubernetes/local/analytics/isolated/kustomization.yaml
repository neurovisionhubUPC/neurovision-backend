apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: neurovision-analytics-smoke

resources:
  - namespace.yaml
  - ../../dependencies/kafka.yaml
  - ../../dependencies/analytics-mongodb.yaml
  - ../../dependencies/analytics-kafka-topics-job.yaml
  - ../../../config/analytics-configmap.yaml
  - ../analytics-service.yaml

patches:
  - path: kafka-isolated-patch.yaml
  - path: topics-isolated-patch.yaml
  - path: analytics-isolated-config-patch.yaml
