apiVersion: v1
kind: Service
metadata:
  name: telemetry-timescaledb
  namespace: neurovision
  labels:
    app.kubernetes.io/name: telemetry-timescaledb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: neurovision-rehab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: telemetry-timescaledb
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telemetry-timescaledb
  namespace: neurovision
  labels:
    app.kubernetes.io/name: telemetry-timescaledb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: neurovision-rehab
spec:
  serviceName: telemetry-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-timescaledb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: neurovision-rehab
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.30.1-pg17
          imagePullPolicy: Never
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: neurovision_telemetry
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: telemetry-database-credentials
                  key: TELEMETRY_DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetry-database-credentials
                  key: TELEMETRY_DB_PASSWORD
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
