apiVersion: v1
kind: Service
metadata:
  name: analytics-mongodb
  namespace: neurovision
  labels:
    app.kubernetes.io/name: analytics-mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: neurovision-rehab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: analytics-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: analytics-mongodb
  namespace: neurovision
  labels:
    app.kubernetes.io/name: analytics-mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: neurovision-rehab
spec:
  serviceName: analytics-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: neurovision-rehab
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:8.0.14-noble
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
