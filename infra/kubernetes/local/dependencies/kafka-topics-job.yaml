apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: neurovision
  labels:
    app.kubernetes.io/name: kafka-topics
    app.kubernetes.io/component: broker-provisioning
    app.kubernetes.io/part-of: neurovision-rehab
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
        app.kubernetes.io/component: broker-provisioning
        app.kubernetes.io/part-of: neurovision-rehab
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                echo "Waiting for Kafka..."
                sleep 3
              done

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create \
                --if-not-exists \
                --topic patient-account-invited.v1 \
                --partitions 3 \
                --replication-factor 1

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create \
                --if-not-exists \
                --topic patient-account-invited.v1.dlq \
                --partitions 3 \
                --replication-factor 1

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create \
                --if-not-exists \
                --topic doctor-account-invited.v1 \
                --partitions 3 \
                --replication-factor 1

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create \
                --if-not-exists \
                --topic doctor-account-invited.v1.dlq \
                --partitions 3 \
                --replication-factor 1

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create \
                --if-not-exists \
                --topic neurovision.dlq-replay-audit.v1 \
                --partitions 1 \
                --replication-factor 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
