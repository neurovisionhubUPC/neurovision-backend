apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: neurovision-cors
  namespace: neurovision
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: neurovision-rehab
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Accept
      - Authorization
      - Content-Type
    accessControlAllowOriginList:
      # Add the deployed frontend origin in an environment overlay.
      - http://localhost:5173
    accessControlMaxAge: 600
    addVaryHeader: true
