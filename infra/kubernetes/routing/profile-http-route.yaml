apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: profile-service
  namespace: neurovision
  labels:
    app.kubernetes.io/name: profile-service
    app.kubernetes.io/component: profile
    app.kubernetes.io/part-of: neurovision-rehab
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system
      sectionName: web
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  # Add hostnames in an environment overlay when the public API domain is known.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/profile
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: neurovision-cors
      backendRefs:
        - group: ""
          kind: Service
          name: profile-service
          port: 8080
          weight: 1
