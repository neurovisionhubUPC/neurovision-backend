apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: neurovision-local

servers: 1
agents: 0
image: rancher/k3s:v1.35.5-k3s1

kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "6550"

ports:
  - port: 127.0.0.1:8080:80
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:8443:443
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: 120s
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
